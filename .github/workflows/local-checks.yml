name: Local helpdesk checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter_v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: starter_v0/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q -x '(/|\\)(\.venv|__pycache__)(/|\\)' .
      - run: python scripts/check_submission.py
      - run: python -m unittest discover -s checks -v
